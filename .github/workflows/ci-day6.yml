# =============================================================================
# Day 6 — CI for a two-service application.
#
# Day 5's pipeline built ONE image and pushed it. The deliverable here adds two
# things: a quality gate that must pass first (lint + tests), and a second image.
# The registry mechanics underneath are unchanged from Day 5 — deliberately.
#
# Two jobs, because they have different failure meanings:
#   lint-and-test  — "is this code acceptable?"  Cheap, runs on Node directly.
#   build-and-push — "package and publish it."   Only worth doing if the above passed.
#
# Inside build-and-push the order is: build -> SCAN -> push. The scan sits
# between them so that nothing unscanned is ever published; see the security
# gate section below.
#
# PUBLISHING TARGETS — both, from one build:
#   localhost:5000  the task's requirement. Ephemeral: the `services:` registry
#                   is created and destroyed with the job, so it proves the
#                   pipeline works but leaves nothing behind.
#   ghcr.io         beyond the brief, and the reason to bother: a DURABLE
#                   package you can actually pull, inspect and point at after
#                   the run is over.
# Tagging is free (a tag is a pointer, not a copy), so one `docker build` with
# four -t flags feeds both registries. There is no second build.
# =============================================================================

name: CI (Day 6)

on:
  push:
    branches:
      - main
      - Day-6-Fullstack-App
      - Day-6-Followups
  workflow_dispatch:

# GITHUB_TOKEN is minted fresh per run and expires when the job ends, so there
# is no long-lived credential stored anywhere. `packages: write` is what lets it
# push to GHCR; without this the login succeeds and the push 403s.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: localhost:5000
  GHCR: ghcr.io
  APP_DIR: Day-6-Fullstack-App

jobs:
  # ---------------------------------------------------------------------------
  # Quality gate.
  #
  # `strategy.matrix` runs this job once PER VALUE — two parallel jobs from one
  # block of YAML, one for backend/ and one for frontend/. ${{ matrix.service }}
  # is the current value. Without it this job would be copy-pasted twice.
  # ---------------------------------------------------------------------------
  lint-and-test:
    runs-on: ubuntu-latest

    strategy:
      # Without this, a backend failure would cancel the frontend job mid-run and
      # you would not learn whether the frontend was also broken.
      fail-fast: false
      matrix:
        service: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}/${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Caches ~/.npm between runs, keyed on the lockfile. Needs the path
          # because the lockfiles are not at the repo root.
          cache: npm
          cache-dependency-path: ${{ env.APP_DIR }}/${{ matrix.service }}/package-lock.json

      # `npm ci` not `npm install` — same reason as in the Dockerfiles: it
      # installs the exact locked tree and fails loudly if the lock is stale.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # --if-present makes one step work for both services: the backend has a
      # `test` script, the frontend does not, and a missing script is not a
      # failure. The frontend's real gate is lint + a build that must compile.
      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Package and publish.
  # ---------------------------------------------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    # The whole point of the gate: nothing is built, let alone published, unless
    # BOTH matrix legs above succeeded.
    needs: lint-and-test

    # A `service` is a container the runner starts before any step and removes
    # after the job — how a pipeline gets a database, a cache, or here a
    # registry to push to.
    services:
      registry:
        image: registry:2
        ports:
          - 5000:5000

    steps:
      - uses: actions/checkout@v4

      # The runner waits for the service CONTAINER to start, not for the process
      # inside it to be READY. Same distinction as `depends_on: service_healthy`
      # in compose. Poll the registry's API handshake endpoint until it answers.
      - name: Wait for the local registry to accept connections
        run: |
          for i in $(seq 1 30); do
            if curl -sf "http://${REGISTRY}/v2/" >/dev/null; then
              echo "registry ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "registry never became ready"
          exit 1

      # GHCR NAMING has three traps, all learned on Day 5:
      #
      #  a) The path is NESTED: ghcr.io/<owner>/<repo>/<image>. Everything after
      #     the owner is the PACKAGE NAME — here "devops-tasks/day6-backend", a
      #     name that contains a slash.
      #  b) The ENTIRE path must be lowercase, not just the owner. GitHub allows
      #     capitals in usernames and repo names ("DevOps-Tasks"); Docker
      #     references do not. Folded here rather than hard-coded, so this does
      #     not break if the repo is renamed or forked.
      #  c) That slash must be URL-encoded as %2F when the package name appears
      #     in a REST API path, or the API reads it as extra path segments and
      #     404s — which looks exactly like "package does not exist yet".
      - name: Compute image references and tag
        id: meta
        run: |
          OWNER="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          REPO="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"
          SHA_TAG="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          {
            echo "owner=${OWNER}"
            echo "repo=${REPO}"
            echo "sha_tag=${SHA_TAG}"
            # Used as the Trivy DB cache key, so the database refreshes daily.
            echo "date=$(date -u +%Y-%m-%d)"
          } >> "$GITHUB_OUTPUT"
          echo "local : ${REGISTRY}/day6-<service>:${SHA_TAG}"
          echo "ghcr  : ${GHCR}/${OWNER}/${REPO}/day6-<service>:${SHA_TAG}"

      # `env.ACT` is set only when running under nektos/act, which has no GHCR
      # credentials. Skipping the login and the GHCR push keeps local runs
      # working; the local-registry half still exercises the whole pipeline.
      - name: Log in to GHCR
        if: ${{ !env.ACT }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ONE build per service, FOUR tags. A tag is a pointer, not a copy, so the
      # three extra names cost nothing and no image is built twice.
      #
      # The org.opencontainers.image.source label is what LINKS the published
      # package to this repository. That link is not cosmetic — it is what gives
      # the repo's GITHUB_TOKEN admin rights over the package, and it is what
      # makes the package page show the source repo.
      - name: Build both images
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO: ${{ steps.meta.outputs.repo }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            LOCAL="${REGISTRY}/day6-${svc}"
            GH="${GHCR}/${OWNER}/${REPO}/day6-${svc}"
            echo "::group::build day6-${svc}"
            docker build \
              --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              -t "${LOCAL}:${SHA_TAG}" -t "${LOCAL}:latest" \
              -t "${GH}:${SHA_TAG}"    -t "${GH}:latest" \
              "${APP_DIR}/${svc}"
            echo "::endgroup::"
          done

      # =======================================================================
      # SECURITY GATE — after build, before ANY push.
      #
      # The position is the whole point. Trivy inspects the image sitting in the
      # runner's local Docker daemon; no registry is involved. Putting it here
      # means nothing unscanned is ever published to anywhere. A scan that runs
      # after the push is a report, not a gate — the bad artifact is already out.
      # =======================================================================
      # Trivy runs as a CONTAINER rather than via a setup- action. Two reasons:
      #   1. It is byte-for-byte the same invocation used to scan these images
      #      locally, so a green pipeline and a green laptop mean the same thing.
      #   2. One less action to resolve. The version is pinned for exactly the
      #      reason §8.5 of the README gives for pinning base images — except
      #      here the pin is on the scanner, so a Trivy release cannot silently
      #      change what this gate considers a failure.
      #
      # The socket mount lets it read images straight out of the runner's local
      # daemon; no registry is involved.

      # The vulnerability database is ~100 MB pulled from GHCR, and GHCR
      # rate-limits. Caching it keyed on the date means one download per day
      # rather than one per run, while still staying current.
      - name: Cache the Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/trivy-cache
          key: trivy-db-${{ steps.meta.outputs.date }}
          restore-keys: trivy-db-

      # TWO passes per image, deliberately, because the task asks for two
      # different things.
      #
      # Pass 1 REPORTS. --severity HIGH,CRITICAL with --exit-code 0 always
      # succeeds; its job is to put a readable table in the log so a developer
      # can see what is present and why the next step failed. HIGH is included
      # here precisely because it is NOT included in the gate — otherwise those
      # findings would be invisible.
      - name: Scan both images (report)
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/trivy-cache"
          for svc in backend frontend; do
            echo "::group::trivy report — day6-${svc}"
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --format table \
              "${REGISTRY}/day6-${svc}:${SHA_TAG}"
            echo "::endgroup::"
          done

      # Pass 2 GATES. --exit-code 1 makes a non-empty result fail the step, and
      # a failed step fails the job before either push runs.
      #
      # Note what is NOT here: --ignore-unfixed. That flag is the common
      # real-world softening — it hides CVEs with no available patch, which are
      # arguably unactionable. It is omitted because the brief says fail on ANY
      # critical, and because it would have hidden nothing anyway: every finding
      # this gate caught during development had a published fix.
      - name: Fail on any CRITICAL vulnerability
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            echo "Gating day6-${svc} on CRITICAL severity..."
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
              aquasec/trivy:0.72.0 image \
              --scanners vuln \
              --severity CRITICAL \
              --exit-code 1 \
              --format table \
              "${REGISTRY}/day6-${svc}:${SHA_TAG}"
          done
          echo "No CRITICAL vulnerabilities in either image — safe to publish."

      # The task's actual requirement.
      #
      # A bash loop, NOT a second matrix — on purpose. A matrix would give each
      # leg its own registry service container, so no single /v2/_catalog would
      # ever list both images. For a step whose entire job is to prove the push
      # landed, that would be actively misleading.
      - name: Push to the local registry
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            docker push "${REGISTRY}/day6-${svc}:${SHA_TAG}"
            docker push "${REGISTRY}/day6-${svc}:latest"
          done

      # The durable half. Note there is no rebuild — these are the same images,
      # already built above, under a second name.
      - name: Push to GHCR
        if: ${{ !env.ACT }}
        env:
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO: ${{ steps.meta.outputs.repo }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            GH="${GHCR}/${OWNER}/${REPO}/day6-${svc}"
            docker push "${GH}:${SHA_TAG}"
            docker push "${GH}:latest"
          done

      # A push that is not verified is a hope. Ask each registry directly.
      - name: Verify the local registry
        run: |
          echo "--- repositories ---"
          curl -sf "http://${REGISTRY}/v2/_catalog"; echo
          for svc in backend frontend; do
            echo "--- tags for day6-${svc} ---"
            curl -sf "http://${REGISTRY}/v2/day6-${svc}/tags/list"; echo
          done

      - name: Verify GHCR
        if: ${{ !env.ACT }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ steps.meta.outputs.owner }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          for svc in backend frontend; do
            # %2F, not a literal slash — see the naming notes on the meta step.
            PKG="${REPO}%2Fday6-${svc}"
            echo "--- ${GHCR}/${OWNER}/${REPO}/day6-${svc} ---"
            gh api --paginate "/users/${OWNER}/packages/container/${PKG}/versions" \
              | jq -r 'sort_by(.created_at)[]
                       | "\(.created_at)  \(.metadata.container.tags | join(",") // "<untagged>")"'
          done
