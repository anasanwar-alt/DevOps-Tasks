# This one file does two jobs, and the second one is the reason there is no CORS
# anywhere in this project.
#
# The browser only ever talks to ONE origin: http://localhost:8080. Requests to
# /api/* are forwarded server-side to the backend container. As far as the
# browser is concerned there is no cross-origin request to permit, so the
# backend needs no `cors` package and no Access-Control-* headers.

server {
    listen 80;
    server_name _;

    # --- Job 1: proxy the API -----------------------------------------------
    # 'backend' is the docker-compose SERVICE NAME. Compose's built-in DNS
    # resolves it to the backend container's IP on the project network — the
    # same mechanism as `PGHOST: db` in Day 4.
    #
    # GOTCHA: with a literal hostname (no variables) in proxy_pass, nginx
    # resolves it ONCE at startup and refuses to start if it does not resolve.
    # That is Day 4's "started is not ready" lesson at a different layer, and
    # the fix is the same: depends_on -> condition: service_healthy.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxied too, so `curl localhost:8080/health` can reach the backend probe
    # without publishing the backend's port.
    location /health {
        proxy_pass http://backend:3000/health;
    }

    # --- Job 2: serve the React bundle --------------------------------------
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA fallback. A single-page app owns its own routing, so a request for
        # /whatever must return index.html (and let React decide) rather than a
        # 404 for a file that was never meant to exist on disk.
        try_files $uri $uri/ /index.html;
    }
}
